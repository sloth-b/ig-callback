<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>승인 완료</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px 16px; background: #fafafa; color: #222; }
  h1 { font-size: 22px; }
  textarea { width: 100%; height: 120px; font-size: 13px; box-sizing: border-box; }
  button { margin-top: 12px; width: 100%; padding: 14px; font-size: 17px; border: 0; border-radius: 8px; background: #0866ff; color: #fff; }
  p { line-height: 1.6; }
</style>
</head>
<body>
<h1>✅ 승인됐어요</h1>
<p>아래 주소 전체를 복사해서 노트북 쪽 사람에게 보내 주세요. (1시간 안에, 한 번만 쓸 수 있어요)</p>
<textarea id="u" readonly></textarea>
<button id="c">주소 복사하기</button>
<p id="m"></p>
<script>
  // 이 페이지는 주소를 보여 주기만 하고 어디에도 보내지 않는다
  var u = document.getElementById("u");
  u.value = location.href;
  document.getElementById("c").onclick = function () {
    u.select();
    (navigator.clipboard ? navigator.clipboard.writeText(location.href) : Promise.reject())
      .then(function () { document.getElementById("m").textContent = "복사됐어요. 카톡 등으로 보내 주세요."; })
      .catch(function () { document.execCommand("copy"); document.getElementById("m").textContent = "복사됐어요."; });
  };
</script>
</body>
</html>
